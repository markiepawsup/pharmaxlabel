<style>

<script>
const ADMIN_VERSION = 'v1.39';
const ST = { WAIT: 'รออนุมัติ', OK: 'อนุมัติแล้ว', NO: 'ไม่อนุมัติ', DONE: 'ดำเนินการแล้ว' };
let PW = sessionStorage.getItem('adm_pw') || '';
let DATA = null, TAB = 'drugs', FILTER = 'wait';
let USER_SEARCH = '', USER_SORT = 'date_desc', USER_TYPE = 'all';
// ===== ชนิดยา / เวลาใช้ยา / สรรพคุณ / คำแนะนำสำเร็จรูป: อ่านจาก data.js ของหน้าเว็บหลัก (แหล่งเดียวกับ index.html) =====
// ตั้ง URL หน้าเว็บที่ Script properties > SITE_URL · ถ้าโหลดไม่ได้ ใช้ค่าที่มีอยู่แล้วใน drugTH แทน
let TYPES = [], MEALS = [], PRESET = { ind: [], adv: [] }, SITE_OK = null, SITE_WHY = '', SITE_TRIED = '';
function loadSiteData(url) {
  return new Promise(res => {
    if (SITE_OK !== null) return res(SITE_OK);
    if (!url) { SITE_OK = false; SITE_WHY = 'notset'; return res(false); }
    SITE_TRIED = url + 'data.js';
    let done = false;
    const fin = ok => { if (done) return; done = true; SITE_OK = ok; res(ok); };
    const sc = document.createElement('script');
    sc.src = url + 'data.js?v=' + Date.now();
    sc.onload = () => {
      try {
        TYPES = SHEET_DRUG_TYPES.slice(); MEALS = SHEET_MEALS.slice();
        PRESET = { ind: indicationsDB.map(x => x && x.th).filter(Boolean), adv: advicesDB.map(x => x && x.th).filter(Boolean) };
        fin(true);
      } catch (e) { SITE_WHY = 'old'; fin(false); }
    };
    sc.onerror = () => { SITE_WHY = 'loaderr'; fin(false); };
    document.head.appendChild(sc);
    setTimeout(() => { if (!done) SITE_WHY = 'loaderr'; fin(false); }, 8000);
  });
}
let _cands = null;
function candsFor(kind) {            // kind: 'ind' | 'adv'  (สำเร็จรูปมาก่อน แล้วตามด้วยของยาตัวอื่นในชีท)
  const key = kind === 'ind' ? 'indications' : 'advices';
  if (!_cands || _cands.n !== DATA) {
    const mk = (base, extra) => { const seen = {}, out = []; base.concat(extra || []).forEach(t => { t = String(t || '').trim(); if (t && !seen[t]) { seen[t] = true; out.push(t); } }); return out; };
    _cands = { n: DATA, ind: mk(PRESET.ind, DATA && DATA.indications), adv: mk(PRESET.adv, DATA && DATA.advices) };
  }
  return _cands[kind];
}
const smartField = (id, val, dis, kind) => '<div class="gw"><div class="gov" id="' + id + '_g" aria-hidden="true"></div>' +
  '<textarea id="' + id + '" rows="2" autocomplete="off" data-smart="' + (kind || (id[1] === 'i' ? 'ind' : 'adv')) + '" ' + (dis || '') + '>' + esc(val) + '</textarea><div class="pop" id="' + id + '_p"></div></div>';

function suggest(typed, cands) {
  if (!typed || !typed.trim()) return null;
  const lo = typed.toLowerCase();
  const p = cands.find(c => c.length > typed.length && c.toLowerCase().startsWith(lo));
  if (p) return { type: 'prefix', text: p.slice(typed.length), full: p };
  const m = cands.find(c => c.toLowerCase().includes(lo) && c.toLowerCase() !== lo);
  if (m) return { type: 'substring', text: '  (👉 กด Tab: ' + m + ')', full: m };
  return null;
}
function wireSmart(id, kind) {
  const ta = document.getElementById(id), ov = document.getElementById(id + '_g'), pop = document.getElementById(id + '_p');
  if (!ta || ta.disabled) return;
  const cands = () => candsFor(kind);
  const lastLine = v => v.slice(v.lastIndexOf('\n') + 1);
  function setGhost(sug) {
    ta.dataset.gt = sug ? sug.type : ''; ta.dataset.gf = sug ? sug.full : ''; ta.dataset.gs = sug ? sug.text : '';
    ov.innerHTML = esc(ta.value) + (sug ? '<span class="gs">' + esc(sug.text) + '</span>' : '');
    ov.scrollTop = ta.scrollTop;
  }
  function refresh() {

  } else {
    items = items.reverse();
  }

  const nWait = TAB === 'drugs' ? items.filter(x => x.status === ST.WAIT).length : 0;
  $('#list').innerHTML = (nWait ? bulkBar(nWait) : '') + userControls +
    (items.length ? items.map({ users: userCard, drugs: drugCard, edits: editCard, feedback: feedbackCard }[TAB]).join('') : '<div class="card muted">ไม่มีรายการ</div>');
  wireAllSmart();
}

function setIntern(row) {

  act('admin_setIntern', [row, s, e], 'บันทึกช่วงฝึกงานแล้ว');

function sel(id, label, val, list, dis) {

  return '<div><label>' + label + '</label><select id="' + id + '" ' + dis + '><option value="">-- ไม่ระบุ --</option>' +
    L.map(o => '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
}

// v1.38: พรีวิวฉลากจริง — เปิดหน้าเว็บพิมพ์ฉลาก (SITE_URL) ในโหมดพรีวิว ใช้ข้อมูลในการ์ด (รวมที่แอดมินแก้แล้ว)
const PV_LANGS = [['en', 'อังกฤษ'], ['zh-CN', 'จีนย่อ'], ['zh-TW', 'จีนเต็ม'], ['ja', 'ญี่ปุ่น'], ['ko', 'เกาหลี'], ['my', 'พม่า'], ['km', 'เขมร'], ['vi', 'เวียดนาม'], ['ru', 'รัสเซีย'], ['ar', 'อาหรับ'], ['hi', 'ฮินดี'], ['fr', 'ฝรั่งเศส'], ['de', 'เยอรมัน'], ['es', 'สเปน'], ['it', 'อิตาลี']];
let PV_LANG = 'en';
function pvUrl(drug, lang) {
  let base = String((DATA && DATA.siteUrl) || '').trim(); if (!base) return '';
  base = base.replace(/[#?].*$/, ''); if (!/\.html?$/i.test(base)) base = base.replace(/\/?$/, '/') + 'index.html';
  return base + '#pmxpreview=' + encodeURIComponent(JSON.stringify({ drug: drug, lang: lang }));
}
function previewDrug(row) {
  const e = drugEdited(row);
  if (!(DATA && DATA.siteUrl)) return toast('❌ ยังไม่ได้ตั้ง SITE_URL ใน Script properties — พรีวิวต้องเปิดหน้าเว็บจริง');
  const drug = { name: e.tradeName + (e.genericName ? ' (' + e.genericName + ')' : ''), drugType: e.drugType, meal: e.meal, morning: e.morning, noon: e.noon, evening: e.evening, bed: e.bed,
    indication: e.indication, advice: e.advice, category: e.category };
  window._pvDrug = drug;
  openModal('👁 ตัวอย่างฉลาก — ' + esc(drug.name),
    '<div class="row" style="margin-bottom:10px"><span class="muted">ภาษาที่ 2</span><select id="pv_lang" style="width:auto" onchange="PV_LANG=this.value;document.getElementById(\'pv_f2\').src=pvUrl(window._pvDrug,PV_LANG)">' +
      PV_LANGS.map(l => '<option value="' + l[0] + '"' + (l[0] === PV_LANG ? ' selected' : '') + '>' + l[1] + ' (' + l[0] + ')</option>').join('') + '</select>' +
      '<span class="muted" style="flex:1">ฉลากจริงจากหน้าเว็บ · กล่องเตือนใต้ฉลาก = ประโยคที่ยังไม่อยู่ใน glossary (แปลอัตโนมัติ) — อนุมัติแล้วระบบเพิ่มเข้า glossary ให้ตรวจ</span></div>' +
    '<div class="pv-grid"><iframe id="pv_f1" title="ฉลากภาษาไทย" src="' + esc(pvUrl(drug, 'th')) + '"></iframe><iframe id="pv_f2" title="ฉลากภาษาที่ 2" src="' + esc(pvUrl(drug, PV_LANG)) + '"></iframe></div>' +
    '<div class="row" style="margin-top:12px;justify-content:flex-end">' + (DATA.drugs.some(x => x.row === row && x.status === ST.WAIT) ? '<button class="btn g" onclick="closeModal();approveDrug(' + row + ')">✅ อนุมัติ</button>' : '') + '<button class="btn s" onclick="closeModal()">ปิด</button></div>', true);
}

      '<div style="white-space:pre-wrap;margin-top:4px">' + esc(f.reply) + '</div></div>' : '') +
    '<details' + (f.reply ? '' : ' open') + ' style="margin-top:6px"><summary style="cursor:pointer;color:#16478E;font-weight:600">' + (f.reply ? '✏️ แก้คำตอบ / ตอบเพิ่ม' : '💬 ตอบกลับผู้ส่ง') + '</summary>' +

function replyFeedback(row) {

function editCtrl(id, key, val) {
  if (key === 'drugtype' || key === 'meal') {
    const L = (key === 'drugtype' ? TYPES : MEALS).slice(); if (val && L.indexOf(val) < 0) L.unshift(val);
    return '<select id="' + id + '"><option value="">-- ไม่ระบุ --</option>' + L.map(o => '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  }
  if (key === 'indication' || key === 'advice') return smartField(id, val, '', key === 'indication' ? 'ind' : 'adv');
  return '<input id="' + id + '" value="' + esc(val) + '">';
}
function editCard(e) {
  const w = e.status === ST.WAIT, ch = e.changes || [];
  let h = '<div class="card"><div class="row"><b>' + esc(e.drugName || ('บาร์โค้ด ' + e.barcodeNo)) + '</b>' + pill(e.status) + '</div>' +
    '<div class="muted">บาร์โค้ด ' + esc(e.barcodeNo) + ' · โดย ' + esc(e.by || '-') + ' · ' + esc(e.date) + '</div>';
  if (ch.length) {
    if (w && !e.found) h += '<div class="note">⚠ ไม่พบยาบาร์โค้ดนี้ใน drugTH แล้ว (อาจถูกลบ/เปลี่ยนบาร์โค้ด) — อนุมัติไม่ได้</div>';
    h += '<table class="ed"><tr><th>ช่อง</th><th>ค่าปัจจุบัน</th><th>ขอแก้เป็น' + (w ? ' <span class="hintk">(แอดมินแก้ได้ก่อนอนุมัติ)</span>' : '') + '</th></tr>' +
      ch.map((c, i) => {
        const cur = w && c.current != null ? c.current : c.from;
        const moved = w && c.current != null && String(c.current) !== String(c.from);
        return '<tr><td><b>' + esc(c.label) + '</b></td><td class="old">' + esc(cur) +
          (moved ? '<div class="hintk">⚠ ถูกแก้ไปแล้วหลังผู้ใช้ส่งคำขอ (ตอนส่งเป็น: ' + esc(c.from) + ')</div>' : '') + '</td><td>' +
          (w ? editCtrl('ec' + e.row + '_' + i, c.key, c.to) : '<span class="new">' + esc(c.to) + '</span>') + '</td></tr>';
      }).join('') + '</table>';
  }
  if (e.comment) h += '<div style="margin:8px 0;white-space:pre-wrap">💬 ' + esc(e.comment) + '</div>';
  if (e.note) h += '<div class="muted">หมายเหตุแอดมิน: ' + esc(e.note) + '</div>';
  if (w) h += '<div class="row" style="margin-top:10px">' +
    (ch.length ? '<button class="btn g" onclick="approveEdit(' + e.row + ')"' + (e.found ? '' : ' disabled') + '>✅ อนุมัติ → แก้ drugTH ทันที</button>'
      : '<button class="btn g" onclick="doneEdit(' + e.row + ')">✔ แก้เองแล้ว / ดำเนินการแล้ว</button>') +
    '<button class="btn r" onclick="rejectEdit(' + e.row + ')">⛔ ไม่อนุมัติ</button></div>';
  return h + '</div>';
}

async function act(fn, args, okMsg) {
  try { await run(fn, ...args); toast(okMsg); await load(); }

// ===== v1.36: ติ๊กเลือกหลายตัว แล้วอนุมัติเข้า drugTH ในคราวเดียว =====
let BULK_BUSY = false;
function bulkBar(n) {
  return '<div class="card" id="bulkbar" style="position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid #04B085">' +
    '<label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:600"><input type="checkbox" id="dselall" style="width:20px;height:20px;margin:0" onchange="selAllDrugs(this.checked)"> เลือกทั้งหมด (' + n + ')</label>' +
    '<button class="btn g" id="bulkbtn" onclick="bulkApprove()" disabled>✅ อนุมัติที่เลือก → นำเข้า drugTH</button>' +
    '<span class="muted" id="bulkinfo">ติ๊กช่องหน้าชื่อยาที่ตรวจแล้ว</span></div>';
}
function selAllDrugs(on) { document.querySelectorAll('.dsel').forEach(c => { c.checked = on; }); updBulk(); }
function updBulk() {
  const all = document.querySelectorAll('.dsel'), k = document.querySelectorAll('.dsel:checked').length;
  const btn = $('#bulkbtn'), info = $('#bulkinfo'), sa = $('#dselall');
  if (btn) { btn.disabled = !k || BULK_BUSY; btn.textContent = '✅ อนุมัติที่เลือก' + (k ? ' (' + k + ')' : '') + ' → นำเข้า drugTH'; }
  if (info && !BULK_BUSY) info.textContent = k ? 'เลือกแล้ว ' + k + ' ตัว' : 'ติ๊กช่องหน้าชื่อยาที่ตรวจแล้ว';
  if (sa) { sa.checked = k > 0 && k === all.length; sa.indeterminate = k > 0 && k < all.length; }
}
async function bulkApprove() {
  if (BULK_BUSY) return;
  const rows = Array.from(document.querySelectorAll('.dsel:checked')).map(c => +c.value).sort((a, b) => a - b);   // ตามลำดับที่ส่งเข้ามา (เก่า → ใหม่)
  if (!rows.length) return toast('ยังไม่ได้เลือกยา');
  const list = rows.map(r => ({ row: r, edited: drugEdited(r) }));
  const bad = list.filter(x => !x.edited.tradeName || !x.edited.genericName);
  if (bad.length) { $('#dcard' + bad[0].row).scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('ชื่อการค้า/ชื่อสามัญห้ามว่าง (' + bad.length + ' ตัว)'); }
  const names = list.map(x => '• ' + x.edited.tradeName).slice(0, 20).join('\n') + (list.length > 20 ? '\n… และอีก ' + (list.length - 20) + ' ตัว' : '');
  if (!confirm('อนุมัติ ' + list.length + ' ตัว และนำเข้า drugTH + ทุกแท็บภาษา?\n\n' + names + '\n\n(ใช้ค่าที่แก้ไว้ในแต่ละการ์ด · ระบบทำทีละตัว อาจใช้เวลาตัวละหลายวินาที — อย่าปิดหน้านี้จนกว่าจะเสร็จ)')) return;
  BULK_BUSY = true;
  const info = $('#bulkinfo'), btn = $('#bulkbtn');
  if (btn) btn.disabled = true;
  document.querySelectorAll('.dsel, #dselall').forEach(c => { c.disabled = true; });
  const ok = [], fail = [], untr = [];
  for (let i = 0; i < list.length; i++) {
    const x = list[i];
    if (info) info.textContent = '⏳ กำลังนำเข้า ' + (i + 1) + '/' + list.length + ': ' + x.edited.tradeName;
    try {
      const r = await run('admin_approveDrug', x.row, x.edited);
      ok.push(x.edited.tradeName);
      if (r && r.untranslated && r.untranslated.length) untr.push(x.edited.tradeName + ' (' + r.untranslated.join(', ') + ')');
      const card = $('#dcard' + x.row); if (card) { card.style.opacity = '.45'; card.style.borderLeft = '4px solid #04B085'; }
    } catch (e) {
      fail.push(x.edited.tradeName + ': ' + e.message);
      const card = $('#dcard' + x.row); if (card) card.style.borderLeft = '4px solid #e53935';
    }
  }
  BULK_BUSY = false;
  alert('✅ นำเข้า drugTH แล้ว ' + ok.length + ' จาก ' + list.length + ' ตัว' +
    (fail.length ? '\n\n❌ ไม่สำเร็จ ' + fail.length + ' ตัว (ยังรออนุมัติอยู่):\n' + fail.join('\n') : '') +
    (untr.length ? '\n\n⚠ แปลไม่สำเร็จบางช่อง (ใช้ข้อความไทยไปก่อน ตรวจในแท็บ 🌐):\n' + untr.join('\n') : ''));
  await load();
}

function nmDiff(a, b) {   // ไฮไลต์ส่วนที่ต่าง (ตัดหัว-ท้ายที่เหมือนกัน)
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  const mid = (s, tag) => esc(s.slice(0, i)) + (s.length - j > i ? '<' + tag + '>' + esc(s.slice(i, s.length - j)).replace(/ /g, '␣') + '</' + tag + '>' : '') + esc(s.slice(s.length - j));
  return [mid(a, 'del'), mid(b, 'ins')];
}

function hbars(list, label, opt) {

const TR_ = { W: 1100, H: 230, pl: 44, pr: 14, pt: 12, pb: 26 };
function niceMax_(series) { const max = Math.max(4, Math.max.apply(null, series.map(x => x.n))); const step = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / step) * step; }
function trendSvg(series) {
  const { W, H, pl, pr, pt, pb } = TR_, n = series.length, nice = niceMax_(series);
  const x = i => pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)), y = v => pt + (H - pt - pb) * (1 - v / nice);
  const pts = series.map((d, i) => x(i).toFixed(1) + ',' + y(d.n).toFixed(1));
  const grid = [0, 0.5, 1].map(f => '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(nice * f) + '" y2="' + y(nice * f) + '" class="tg"/><text x="' + (pl - 6) + '" y="' + (y(nice * f) + 4) + '" class="tl" text-anchor="end">' + nf(Math.round(nice * f)) + '</text>').join('');
  const every = Math.ceil(n / 8);
  const xl = series.map((d, i) => ((i % every === 0 && (n - 1 - i >= every / 2 || i === n - 1)) || i === n - 1) ? '<text x="' + x(i) + '" y="' + (H - 6) + '" class="tl" text-anchor="middle">' + d.d.slice(8, 10) + '/' + d.d.slice(5, 7) + '</text>' : '').join('');

    '<path d="M' + x(0) + ',' + y(0) + ' L' + pts.join(' L') + ' L' + x(n - 1) + ',' + y(0) + ' Z" class="ta"/>' +
    '<polyline points="' + pts.join(' ') + '" class="tline"/>' + xl +
    '<line class="tx" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" style="display:none"/><circle class="td" r="4.5" style="display:none"/>' +
    '<rect x="' + pl + '" y="0" width="' + (W - pl - pr) + '" height="' + H + '" fill="transparent"/></svg><div class="ttip" style="display:none"></div></div>';

function trendHover(e, svg) {
  const wrap = svg.parentNode, tip = wrap.querySelector('.ttip'), ln = svg.querySelector('.tx'), dot = svg.querySelector('.td');
  if (!e) { tip.style.display = ln.style.display = dot.style.display = 'none'; return; }

  const vx = (e.clientX - r.left) * W / r.width;
  const i = Math.max(0, Math.min(n - 1, Math.round((vx - pl) / ((W - pl - pr) / Math.max(1, n - 1)))));
  const px = pl + (n <= 1 ? 0 : i * (W - pl - pr) / (n - 1)), py = pt + (H - pt - pb) * (1 - s[i].n / nice);
  ln.setAttribute('x1', px); ln.setAttribute('x2', px); dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  ln.style.display = dot.style.display = '';
  const d = new Date(s[i].d + 'T00:00:00');
  tip.innerHTML = '<b>' + nf(s[i].n) + ' ใบ</b><br>' + d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: '2-digit' });
  tip.style.display = 'block';
  tip.style.left = Math.min(r.width - 124, Math.max(0, px * r.width / W - 62)) + 'px';
}

    const r = await run('admin_readSheet', SH.name, SH.q, offset == null ? SH.offset : offset, SH.limit);
    SH.headers = r.headers; SH.rows = r.rows; SH.total = r.total; SH.offset = r.offset; SH.locked = r.locked || [];
  } catch (e) { toast('❌ ' + e.message); }
  SH.loading = false; renderData();
}

function pickSheet(name) { if (!guard()) return renderData(); SH.name = name; SH.q = ''; SH.adding = false; loadSheet(0); }
function doSearch() { if (!guard()) return; SH.q = $('#dt_q').value; loadSheet(0); }
function goPage(off) { if (!guard()) return; loadSheet(Math.max(0, off)); }

// สร้างช่องกรอก 1 ช่อง ตามชนิดคอลัมน์ (ชนิดยา/เวลาที่ใช้ยา ของ drugTH เป็น dropdown, กลุ่มยามี datalist)
function ctrl(ci, v, attrs, dis, cls) {
  const k = hk(SH.headers[ci]), isMain = SH.name === SH.main;
  const a = ' ' + attrs + ' class="' + (cls || '') + '"' + (dis ? ' disabled' : '');
  const isRx = SH.name === REGIMEN_TAB;   // v1.37: แท็บวิธีใช้ตามโรค — เวลาใช้ยา/สถานะ เป็น dropdown
  const list = isMain && k.indexOf('drugtype') === 0 ? TYPES : (isMain || isRx) && k.indexOf('meal') === 0 ? MEALS : isRx && k.indexOf('status') === 0 ? ['ใช้งาน', 'รอตรวจ', 'ปิด'] : null;
  if (list) {
    const L = list.slice(); if (v && L.indexOf(v) < 0) L.unshift(v);
    return '<select' + a + '><option value=""></option>' + L.map(o => '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  }
  if (isMain && k.indexOf('category') === 0) return '<input' + a + ' list="dl_cat" value="' + esc(v) + '">';
  if (/indication|advice|line\d|note|comment|หมายเหตุ|definition|meaning|desc/.test(k) || String(v).length > 45 || String(v).indexOf('\n') >= 0)
    return '<textarea' + a + '>\n' + esc(v) + '</textarea>';       // ขึ้นบรรทัดว่างนำหน้า เพราะ HTML ตัดบรรทัดแรกของ textarea ทิ้ง
  return '<input' + a + ' value="' + esc(v) + '">';
}

function renderData() {

  const info = shInfo(), ro = !!info.readOnly;
  const opts = SH.sheets.map(x => '<option value="' + esc(x.name) + '"' + (x.name === SH.name ? ' selected' : '') + '>' + (x.private ? '🔒 ' : '') + esc(x.name) + ' (' + x.rows + ')</option>').join('');

    '<button class="btn s" onclick="doSearch()">🔍 ค้นหา</button>' +
    (info.canAdd ? '<button class="btn g" onclick="toggleAdd()">➕ เพิ่มแถว</button>' : '') +
    '<button class="btn s" onclick="recatOpen()" title="ย้ายยาในกลุ่ม โรคติดเชื้อและยาปฏิชีวนะ ไปกลุ่ม แบคทีเรีย / รา / ไวรัส">🏷 แยกกลุ่มโรคติดเชื้อ</button>' +
    '<button class="btn s" onclick="regimenOpen()" title="ยาที่วิธีใช้ต่างกันตามโรค (แท็บ diseaseRegimen) — สร้างแท็บ/ตรวจหัวตาราง แล้วเปิดแก้ไข">🩺 วิธีใช้ตามโรค</button>' +
    '<button class="btn s" onclick="geocodeBranches()" title="หาพิกัดสาขาจากลิงก์ Google Maps (คอลัมน์ map) หรือค้นจากที่อยู่ — ให้มือถือ/แท็บเล็ตเลือกสาขาใกล้ที่สุดอัตโนมัติ">📍 หาพิกัดสาขา</button>' +
    '<button class="btn s" onclick="notifyOpen()" title="อีเมลแจ้งเตือนเมื่อมียาใหม่ / คำขอแก้ไข / ฟีดแบ็ก / สมัครใช้งาน">🔔 แจ้งเตือนอีเมล</button></div>';
  const notes = [];
  if (info.private) notes.push('🔒 ชีทนี้อยู่ใน "ไฟล์ลับ" (ไม่แชร์สาธารณะ) — หน้าเว็บผู้ใช้ทั่วไปอ่านไม่ได้');
  if (ro) notes.push('🔒 ชีทนี้เป็นประวัติการแก้ไข ดูได้อย่างเดียว');
  if (SH.locked.length) notes.push('🔒 คอลัมน์ ' + SH.locked.map(i => esc(SH.headers[i])).join(', ') + ' ถูกซ่อนเพื่อความปลอดภัย แก้ไม่ได้');
  if (SH.name === REGIMEN_TAB) notes.push('🩺 <b>วิธีใช้ยาตามโรค</b> — 1 แถว = 1 โรคของยา 1 ตัว · <b>drugName</b> ใส่ชื่อตรงกับ drugTH (แนะนำ เพราะขนาดยาขึ้นกับความแรง) หรือชื่อสามัญตัวพิมพ์ใหญ่ เช่น ACICLOVIR = ทุกยี่ห้อ · <b>matchText</b> (ไม่บังคับ) เช่น 400 = เฉพาะยาที่ชื่อมี 400 · ช่องที่ว่าง = ใช้ค่าเดิมของยา · ขนาดยา 4 ช่อง: กรอกช่องใดช่องหนึ่ง = ใช้ทั้ง 4 ช่องตามแถวนี้ · <b>ว่างทั้ง 4 ช่อง = ใช้ขนาดยาเดิมจาก drugTH</b> · ถ้าไม่ต้องการตารางเวลาบนฉลากเลย ใส่ <b>X</b> ในช่องเช้า (ช่องเดียวพอ) · <b>frequency_th</b> (ไม่บังคับ) = บรรทัด "ความถี่" บนฉลาก เช่น วันละ 5 ครั้ง ห่างกันประมาณ 4 ชั่วโมง / ทุก 6 ชั่วโมง · <b>status</b> ต้องเป็น "ใช้งาน" (หรือว่าง) หน้าพิมพ์ฉลากถึงจะแสดง · คำแปลภาษาอื่นมาจาก medical_glossary');
  if (info.group === 'drug') notes.push('⚠️ แท็บยาทุกภาษาจับคู่กันด้วยชื่อยา (drugName) — ถ้าแก้ชื่อยา ต้องแก้ให้ตรงกันทุกแท็บ drug*');
  if (info.group === 'branches') notes.push('⚠️ แท็บสาขาทุกภาษาจับคู่กันด้วยรหัสสาขา (branchCode) — ถ้าแก้รหัส ต้องแก้ให้ตรงกันทุกแท็บ branches*');
  notes.push('เซลล์สีฟ้า = เป็นสูตร (แก้ในชีทโดยตรง) · ค่าที่บันทึกจากหน้านี้จะเก็บเป็นข้อความ · ทุกการแก้ไขถูกบันทึกในชีท "ประวัติการแก้ไข"');
  h += '<div class="note">' + notes.join('<br>') + '</div>';
  if (SH.adding && info.canAdd) h += addForm(info);
  if (SH.loading) h += '<div class="card muted">กำลังโหลด…</div>';
  else if (!SH.headers.length) h += '<div class="card muted">ชีทนี้ยังไม่มีข้อมูล/หัวคอลัมน์</div>';
  else {
    h += '<datalist id="dl_cat">' + catList().map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>';
    h += '<div class="tbl-wrap"><table class="dt"><thead><tr><th class="act">แถว</th>' + SH.headers.map(x => '<th>' + esc(x) + '</th>').join('') + '</tr></thead><tbody>';
    h += SH.rows.length ? SH.rows.map((r, i) => '<tr data-i="' + i + '"><td class="act"><span class="muted">#' + r.row + '</span> ' +
      (ro ? '' : '<button class="btn g sm" onclick="saveRow(' + i + ')" title="บันทึกแถวนี้">💾</button> <button class="btn r sm" onclick="delRow(' + i + ')" title="ลบแถวนี้">🗑</button>') + '</td>' +
      SH.headers.map((_, ci) => {
        const lock = SH.locked.indexOf(ci) >= 0, fx = r.fx && r.fx.indexOf(ci) >= 0;
        const v = lock ? '••••' : r.v[ci];
        return '<td' + (/indication|advice/.test(hk(SH.headers[ci])) ? ' class="long"' : '') + '>' +
          ctrl(ci, v, 'data-i="' + i + '" data-c="' + ci + '"' + (lock ? ' title="ซ่อนเพื่อความปลอดภัย"' : fx ? ' title="เซลล์นี้เป็นสูตร แก้ในชีทโดยตรง"' : ''), ro || lock || fx, lock ? 'locked' : fx ? 'fx' : '') + '</td>';
      }).join('') + '</tr>').join('') : '<tr><td colspan="' + (SH.headers.length + 1) + '" class="muted" style="padding:14px">ไม่พบรายการ</td></tr>';
    h += '</tbody></table></div>';
    const a = SH.total ? SH.offset + 1 : 0, b = Math.min(SH.total, SH.offset + SH.limit);
    h += '<div class="pager"><button class="btn s sm" ' + (SH.offset <= 0 ? 'disabled' : '') + ' onclick="goPage(' + (SH.offset - SH.limit) + ')">‹ ก่อนหน้า</button>' +
      '<span class="muted">แสดง ' + a + '–' + b + ' จาก ' + SH.total + ' แถว' + (SH.q ? ' (ค้นหา "' + esc(SH.q) + '")' : '') + '</span>' +
      '<button class="btn s sm" ' + (b >= SH.total ? 'disabled' : '') + ' onclick="goPage(' + (SH.offset + SH.limit) + ')">ถัดไป ›</button></div>';
  }
  L.innerHTML = h;
  L.querySelectorAll('textarea[data-c]').forEach(autosize);
}

async function geocodeBranches() {
  const force = confirm('หาพิกัดสาขา (branchesTH)\n\nตกลง = ค้นใหม่ทุกสาขา (ทับพิกัดเดิม)\nยกเลิก = เฉพาะสาขาที่ยังไม่มีพิกัด หรือเพิ่งใส่ลิงก์ map\n\nมีลิงก์ Google Maps ในคอลัมน์ map → ใช้ลิงก์ (แม่นที่สุด) · ไม่มี → ค้นจากที่อยู่ line1 + line2');
  toast('กำลังหาพิกัด… (สาขาละประมาณ 0.3 วินาที)');
  try {
    const r = await run('admin_geocodeBranches', force);
    openModal('📍 หาพิกัดสาขา', '<div class="kpis"><div class="kpi"><small>สำเร็จ</small><b>' + r.done + '</b></div><div class="kpi"><small>มีอยู่แล้ว</small><b>' + (r.kept || 0) + '</b></div><div class="kpi"><small>ไม่สำเร็จ</small><b>' + r.failed.length + '</b></div></div>' +
      (r.failed.length ? '<div class="note">ไม่สำเร็จ — ใส่ลิงก์ Google Maps ของสาขาในคอลัมน์ <b>map</b> แล้วกดอีกครั้ง:<br>' + r.failed.map(esc).join('<br>') + '</div>' : '') +
      '<div class="muted">ตรวจพิกัดได้ที่คอลัมน์ lat / lng / geo_source ในแท็บ branchesTH · ระบบหาพิกัดสาขาใหม่ให้เองทุกคืน</div>');
  } catch (e) { toast('❌ ' + e.message); }
}
async function notifyOpen() {

  openModal('🔔 แจ้งเตือนอีเมล', '<label style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="nt_on" style="width:18px;height:18px"' + (st.on ? ' checked' : '') + '> ส่งอีเมลเมื่อมี ยาใหม่ / คำขอแก้ไข / ฟีดแบ็ก / สมัครใช้งาน / ขอรีเซ็ตรหัส</label>' +
    '<label>ส่งถึง (คั่นหลายคนด้วย ,) — ว่าง = เจ้าของสคริปต์ (' + esc(st.owner || '-') + ')</label><input id="nt_email" value="' + esc(st.email) + '" placeholder="' + esc(st.owner || 'name@example.com') + '">' +
    '<div class="muted" style="margin-top:6px">โควตาอีเมลวันนี้เหลือ ' + st.quota + ' ฉบับ · ส่งไม่เกิน 6 ฉบับ/10 นาที (เกินจะรวมแจ้งในฉบับถัดไป)</div>' +
    '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn s" onclick="notifySave(true)">✉ บันทึก + ส่งอีเมลทดสอบ</button><button class="btn g" onclick="notifySave(false)">💾 บันทึก</button></div>');

async function notifySave(test) {
  try { await run('admin_notifySettings', { email: $('#nt_email').value, on: $('#nt_on').checked, test: test }); toast(test ? '✅ บันทึกแล้ว · ส่งอีเมลทดสอบแล้ว' : '✅ บันทึกแล้ว'); closeModal(); }
  catch (e) { toast('❌ ' + e.message); }
}
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(Math.max(el.scrollHeight + 2, 30), 220) + 'px'; }

function rowDirty(tr, i) {
  const r = SH.rows[i]; let d = false;
  tr.querySelectorAll('[data-c]').forEach(el => { if (!el.disabled && el.value !== r.v[+el.dataset.c]) d = true; });
  return d;
}
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset || el.dataset.i === undefined || el.dataset.c === undefined) return;
  if (el.tagName === 'TEXTAREA') autosize(el);
  const tr = el.closest('tr'); if (tr) tr.classList.toggle('dirty', rowDirty(tr, +el.dataset.i));
});
window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

async function saveRow(i) {
  const r = SH.rows[i], tr = document.querySelector('#list tr[data-i="' + i + '"]'); if (!r || !tr) return;
  const ch = [];
  tr.querySelectorAll('[data-c]').forEach(el => { if (el.disabled) return; const c = +el.dataset.c; if (el.value !== r.v[c]) ch.push({ c: c, v: el.value, o: r.v[c] }); });
  if (!ch.length) return toast('ไม่มีการเปลี่ยนแปลง');
  try {
    const nv = await run('admin_saveRow', SH.name, r.row, ch);
    r.v = nv;
    tr.querySelectorAll('[data-c]').forEach(el => { if (!el.disabled) el.value = nv[+el.dataset.c]; });
    tr.classList.remove('dirty'); toast('✅ บันทึกแถว #' + r.row + ' แล้ว');
  } catch (e) { toast('❌ ' + e.message); }
}

async function delRow(i) {
  const r = SH.rows[i], info = shInfo(); if (!r) return;
  const label = r.v.filter(x => x).slice(0, 3).join(' · ');
  if (!confirm('ลบแถว #' + r.row + ' ในชีท "' + SH.name + '" ?\n' + label + '\n\n(กู้คืนไม่ได้ แต่มีบันทึกในชีทประวัติการแก้ไข)')) return;
  let also = false;
  if (info.group) also = confirm('ลบรายการเดียวกันในแท็บอื่นของกลุ่ม ' + info.group + '* (ทุกภาษา) ด้วยไหม?\n\nตกลง = ลบทุกแท็บ\nยกเลิก = ลบเฉพาะชีทนี้');
  try {
    const res = await run('admin_deleteRow', SH.name, r.row, r.v, also);
    toast('✅ ลบแล้ว' + (res.removed && res.removed.length ? ' (และในอีก ' + res.removed.length + ' แท็บ)' : '') + (res.skipped && res.skipped.length ? ' · ข้าม ' + res.skipped.join(', ') + ' (ไม่มีคอลัมน์กุญแจ ต้องลบเอง)' : ''));
    await loadSheet(SH.offset);
    const info2 = SH.sheets.find(x => x.name === SH.name); if (info2) info2.rows = Math.max(0, info2.rows - 1);
  } catch (e) { toast('❌ ' + e.message); }
}

function toggleAdd() { SH.adding = !SH.adding; renderData(); if (SH.adding) { const f = $('#na0'); if (f) f.focus(); } }
function addForm(info) {
  return '<div class="card"><b>➕ เพิ่มแถวใหม่ใน "' + esc(SH.name) + '"</b><div class="addgrid" style="margin-top:6px">' +
    SH.headers.map((x, ci) => '<div><label>' + esc(x) + '</label>' + ctrl(ci, '', 'id="na' + ci + '"', false, '') + '</div>').join('') + '</div>' +
    (info.group ? '<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="na_also" style="width:auto" ' + (SH.name === SH.main || /TH$/i.test(SH.name) ? 'checked' : '') + '> เพิ่มลงทุกแท็บภาษา (' + info.group + '*) ด้วย — แท็บอื่นจะได้ข้อความเดียวกับที่กรอก ไว้แก้คำแปลทีหลัง</label>' : '') +
    '<div class="row" style="margin-top:10px"><button class="btn g" onclick="addRow()">💾 เพิ่ม</button><button class="btn s" onclick="toggleAdd()">ยกเลิก</button></div></div>';
}
async function addRow() {
  if (!guard()) return;
  const vals = SH.headers.map((_, ci) => { const el = document.getElementById('na' + ci); return el ? el.value : ''; });
  const also = !!($('#na_also') && $('#na_also').checked);
  try {
    const res = await run('admin_addRow', SH.name, vals, also);
    toast('✅ เพิ่มแล้ว' + (res.addedTabs && res.addedTabs.length > 1 ? ' (' + res.addedTabs.length + ' แท็บ)' : ''));
    SH.adding = false; SH.q = '';
    const info = SH.sheets.find(x => x.name === SH.name); if (info) info.rows++;
    await loadSheet(-1);
  } catch (e) { toast('❌ ' + e.message); }
}

// ======================= 🌐 ตรวจคำแปล (แท็บภาษา drugEN, drugJA …) =======================

    '<button class="btn s sm" onclick="syncGloss(\'lines\')" title="คำแปลสรรพคุณ/คำแนะนำทุกบรรทัดใน drugTH จากไฟล์ glossary_lines.js">📝 ซิงก์คำแปลสรรพคุณ/คำแนะนำ</button>' +
    '<button class="btn g sm" onclick="glossFix()" title="ดูรายการก่อน แล้วค่อยยืนยัน">🔧 ใช้ glossary แก้คำแปลในแท็บภาษา</button>' +
    '<button class="btn sm" onclick="upgradeFormulas()" title="สำหรับแท็บภาษาที่เป็นสูตร (GOOGLETRANSLATE/XLOOKUP)">🔗 อัปเกรดสูตรแท็บภาษา</button></div>';
  h += '<div class="note">คำแปลที่ระบบแปลอัตโนมัติ (ตอนอนุมัติยา/แก้ข้อมูล) จะ "รอตรวจ" จนกว่าเภสัชกรจะกด ✅ — ระหว่างรอ หน้าเว็บจะใช้ medical_glossary / พจนานุกรมก่อน · คำแปลที่เตรียมไว้เองเดิมใช้ได้ทันทีไม่ต้องตรวจ (เอาติ๊ก "เฉพาะที่ยังไม่ตรวจ" ออกเพื่อดู/แก้) · ซ้าย = ข้อความไทยใน drugTH · ขวา = คำแปลในแท็บนี้' +
    (needPrep ? '<br>⚠ บางแท็บยังไม่มีคอลัมน์บาร์โค้ด/ตรวจคำแปล — กด "เตรียมแท็บภาษา" 1 ครั้ง' : '') + '</div>';
  if (TR.loading) h += '<div class="card muted">กำลังโหลด…</div>';
  else if (!d.rows.length) h += '<div class="card muted">' + (TR.only ? '🎉 ไม่มีคำแปลที่รอตรวจในแท็บนี้' : 'ไม่มีรายการ') + '</div>';
  else h += d.rows.map((r, i) => '<div class="card"><div class="row"><b>' + esc(r.drugName || '-') + '</b>' +
      (/^ตรวจแล้ว/.test(r.checked) ? '<span class="pill ok">✓ ' + esc(r.checked) + '</span>'
        : /^(แปลอัตโนมัติ|รอตรวจ)/.test(r.checked) ? '<span class="pill w">' + esc(r.checked) + '</span>' : '<span class="pill dn">เตรียมไว้เอง</span>') +
      '<span class="muted">' + (r.barcode ? 'บาร์โค้ด ' + esc(r.barcode) + ' · ' : '') + 'แถว #' + r.row + (r.th.found ? '' : ' · ⚠ หาไม่เจอใน drugTH') + '</span></div>' +
      Object.keys(r.tr).filter(k => r.tr[k] !== null).map(k => '<label>' + TR_LABEL[k] + '</label><div class="trgrid"><div class="th">' + esc(r.th[k] || '—') + '</div>' +
        '<textarea id="tr_' + i + '_' + k + '">' + esc(r.tr[k]) + '</textarea></div>').join('') +
      '<div class="row" style="margin-top:8px"><button class="btn g sm" onclick="saveTr(' + i + ',true)">✅ ถูกต้อง / บันทึก + ตรวจแล้ว</button>' +
      '<button class="btn s sm" onclick="saveTr(' + i + ',false)">💾 บันทึก (ยังไม่ติ๊กตรวจ)</button></div></div>').join('');
  if (d.total > 25) h += '<div class="pager"><button class="btn s sm" ' + (TR.offset <= 0 ? 'disabled' : '') + ' onclick="TR.offset=Math.max(0,TR.offset-25);loadTr()">‹ ก่อนหน้า</button>' +
    '<span class="muted">' + (TR.offset + 1) + '–' + Math.min(d.total, TR.offset + 25) + ' จาก ' + d.total + '</span>' +
    '<button class="btn s sm" ' + (TR.offset + 25 >= d.total ? 'disabled' : '') + ' onclick="TR.offset+=25;loadTr()">ถัดไป ›</button></div>';
  L.innerHTML = h;
  L.querySelectorAll('.trgrid textarea').forEach(autosize);
}
async function saveTr(i, checked) {
  const r = TR.data.rows[i]; if (!r) return;
  const vals = {};
  Object.keys(r.tr).forEach(k => { const el = $('#tr_' + i + '_' + k); if (el) vals[k] = el.value; });
  try {
    const res = await run('admin_saveTranslation', TR.tab, r.row, vals, r.tr, checked);
    toast(checked ? '✅ ตรวจแล้ว' : '💾 บันทึกแล้ว');
    if (checked && TR.only) return loadTr();
    Object.keys(vals).forEach(k => { r.tr[k] = vals[k].trim(); }); r.checked = res.checked; renderTr();
  } catch (e) { toast('❌ ' + e.message); }
}
async function prepLang() {
  if (!confirm('เพิ่มคอลัมน์บาร์โค้ด + "ตรวจคำแปลแล้ว" ในทุกแท็บภาษา และเติมบาร์โค้ดโดยจับคู่ชื่อยากับ drugTH?')) return;
  try { const rep = await run('admin_prepareLangTabs'); alert('เตรียมแท็บภาษาแล้ว\n\n' + rep.join('\n')); TR.data = null; loadTr(); }
  catch (e) { toast('❌ ' + e.message); }
}

  if (!confirm('อัปเกรดสูตรในแท็บภาษาทั้งหมด?\n\n• ให้อ่าน medical_glossary ได้ทุกแถว (เดิมอ่านถึงแถว 48)\n• สรรพคุณ/คำแนะนำ ค้น glossary ก่อน แล้วค่อย GOOGLETRANSLATE\n• เติมแถวสูตรให้พอกับจำนวนยาใน drugTH\n\nทำซ้ำได้ไม่เสียหาย')) return;
  toast('กำลังอัปเกรดสูตร… (อาจใช้เวลา 1–2 นาที)');
  try { const r = await run('admin_upgradeLangFormulas'); alert('✅ อัปเกรดแล้ว\n\n' + r.join('\n') + '\n\nGoogle Sheets จะคำนวณคำแปลใหม่ อาจขึ้น "Loading..." สักครู่'); TR.data = null; loadTr(); }
  catch (e) { toast('❌ ' + e.message); }
}
// ===== v1.36: ซิงก์ medical_glossary ให้ตรงกับคำศัพท์มาตรฐานใน data.js (dropdown ชนิดยา / เวลาใช้ยา / ขนาดยา) =====
const GS_LANGS = ['en', 'ja', 'zh-CN', 'zh-TW', 'ko', 'es', 'fr', 'it', 'de', 'ru', 'ar', 'vi', 'km', 'my', 'hi'];
let GS = null;
function canonFromSite() {
  const rows = [];
  ALL_TYPE_OPTIONS.forEach(o => rows.push(['Drug Form', o.th, o.tr]));
  MEAL_OPTIONS.forEach(o => { if (o.value) rows.push(['Meal Timing', o.th, o.tr]); });
  DOSE_OPTIONS.concat(Object.keys(DOSE_PHRASES)).filter((v, i, a) => a.indexOf(v) === i).forEach(d => {
    const tr = {}; let ok = true;
    GS_LANGS.forEach(l => { const t = doseTextOf(d, l); if (t) tr[l] = t; else ok = false; });
    if (ok) rows.push(['Dosage', d, tr]);
  });
  (typeof GLOSSARY_EXTRA !== 'undefined' ? GLOSSARY_EXTRA : []).forEach(r => rows.push(r));
  const toTh = (kind, o) => { const r = {}; Object.keys(o || {}).forEach(a => { const x = termOptionOf(kind, o[a]); if (x) r[a] = x.th; }); return r; };   // ชื่ออื่น → ชื่อมาตรฐาน (ไทย)
  return { rows: rows, typeAliases: toTh('type', TERM_ALIASES.type), typeReview: toTh('type', TERM_ALIASES.typeReview), mealAliases: toTh('meal', TERM_ALIASES.meal) };
}
// ไฟล์คำแปลสรรพคุณ/คำแนะนำ (ใหญ่ — โหลดเฉพาะตอนกดปุ่ม)
function loadLinesFile() {
  return new Promise(res => {
    if (typeof GLOSSARY_LINES !== 'undefined') return res(true);
    const url = DATA && DATA.siteUrl; if (!url) return res(false);
    const sc = document.createElement('script'); sc.src = url + 'glossary_lines.js?v=' + Date.now();
    sc.onload = () => res(typeof GLOSSARY_LINES !== 'undefined'); sc.onerror = () => res(false);
    document.head.appendChild(sc);
  });
}
async function syncGloss(kind) {
  kind = kind || (GS && GS.kind) || 'vocab';
  const ok = await loadSiteData(DATA && DATA.siteUrl);
  if (!ok || typeof ALL_TYPE_OPTIONS === 'undefined' || typeof doseTextOf !== 'function')
    return alert('โหลดคำศัพท์มาตรฐานจาก data.js (v1.36 ขึ้นไป) ไม่ได้ — อัปโหลด data.js ใหม่ขึ้นเว็บก่อน แล้วกดรีเฟรชหน้านี้');
  if (kind === 'lines' && !(await loadLinesFile()))
    return alert('โหลดไฟล์ glossary_lines.js จากหน้าเว็บไม่ได้ — อัปโหลดไฟล์นี้ขึ้น GitHub (โฟลเดอร์เดียวกับ data.js) ก่อน แล้วรีเฟรชหน้านี้');
  toast(kind === 'lines' ? 'กำลังเทียบคำแปลสรรพคุณ/คำแนะนำกับ glossary… (อาจใช้เวลาสักครู่)' : 'กำลังเทียบ glossary กับตัวเลือกในหน้าเว็บ…');
  const canon = kind === 'lines' ? { kind: 'lines', rows: GLOSSARY_LINES } : canonFromSite();
  try { GS = { kind: kind, canon: canon, plan: await run('admin_glossarySyncPreview', canon) }; } catch (e) { return toast('❌ ' + e.message); }
  renderGS();
}
function renderGS() {
  const L = $('#list'); if (!L || !GS) return;
  const p = GS.plan, it = p.items;
  const grp = [
    ['add', '➕ เพิ่มคำที่ยังไม่มีใน glossary', x => '<b>' + esc(x.th) + '</b> <span class="muted">(' + esc(x.cat) + ')</span> → ' + esc(x.tr.en || '') + (x.tr.ja ? ' · ' + esc(x.tr.ja) : '')],
    ['update', '✏️ คำแปลใน glossary ไม่ตรงกับหน้าเว็บ → แก้ให้ตรง', x => '<b>' + esc(x.th) + '</b> <span class="muted">แถว ' + x.row + (x.why ? ' · ' + esc(x.why) : '') + '</span><br>' +
      x.diffs.map(d => '<span class="muted">' + esc(d.col) + ':</span> <s>' + esc(d.old || '(ว่าง)') + '</s> → ' + esc(d.nv)).join('<br>')],
    ['delete', '🗑 ลบแถวที่ซ้ำ / ชื่อเก่า / สะกดผิด', x => '<b>' + esc(x.th) + '</b> <span class="muted">แถว ' + x.row + ' · ' + esc(x.why) + '</span>'],
    ['fix', '🧾 ค่าใน drugTH เป็นชื่ออื่น → เปลี่ยนเป็นชื่อมาตรฐาน (แท็บภาษาแบบสูตรตามให้เอง)', x => esc(x.drug || '-') + ' <span class="muted">แถว ' + x.row + ' · ' + esc(x.field) + ':</span> <s>' + esc(x.old) + '</s> → <b>' + esc(x.nv) + '</b>' +
      (x.review ? ' <span class="pill w">ตรวจก่อน — ชื่อกว้าง</span>' : '')]
  ];
  let h = '<div class="dt-bar"><button class="btn s sm" onclick="GS=null;renderTr()">‹ กลับ</button><b>' + (GS.kind === 'lines' ? '📝 ซิงก์คำแปลสรรพคุณ/คำแนะนำ (glossary_lines.js)' : '🔄 ซิงก์ medical_glossary กับตัวเลือกในหน้าเว็บ') + '</b></div>' +
    '<div class="note">ตัวเลือกชนิดยา / เวลาใช้ยา / ขนาดยา ในหน้าเว็บ (data.js) คือชื่อมาตรฐาน — ติ๊กรายการที่ต้องการ แล้วกด "ทำรายการที่เลือก" · ระบบสำรองแท็บ glossary ไว้ในไฟล์ลับก่อนแก้ทุกครั้ง' +
    '<br>ถ้าเคยแก้คำแปลใน glossary เองและอยากเก็บไว้ ให้เอาติ๊กข้อนั้นออก (ฉลากใช้คำใน glossary ก่อนเสมอ)</div>';
  if (!it.length) h += '<div class="card">✅ glossary ตรงกับตัวเลือกในหน้าเว็บแล้วทั้งหมด</div>';
  grp.forEach(([k, title, line]) => {
    const xs = it.filter(x => x.kind === k); if (!xs.length) return;
    const big = xs.length > 40;
    h += '<div class="card"><div class="row"><b>' + title + ' (' + xs.length + ')</b>' +
      '<label style="margin:0;font-size:.8rem"><input type="checkbox" style="width:auto" checked onchange="document.querySelectorAll(\'.gs_' + k + '\').forEach(c=>{if(!c.dataset.review)c.checked=this.checked})"> เลือกทั้งหมด</label></div>' +
      (big ? '<details><summary class="muted" style="cursor:pointer;margin:6px 0">ดูรายการทั้งหมด ' + xs.length + ' ข้อ (ติ๊กไว้ให้แล้ว)</summary>' : '') +
      xs.map(x => '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0"><input type="checkbox" style="width:auto;margin-top:3px" class="gs_' + k + ' gs_item" value="' + esc(x.id) + '"' +
        (x.review ? ' data-review="1"' : ' checked') + '><span>' + line(x) + '</span></label>').join('') + (big ? '</details>' : '') + '</div>';
  });
  if (p.notInList.length) h += '<div class="card"><b>⚠ ค่าใน drugTH ที่ยังไม่มีในตัวเลือก</b><div class="muted">' + p.notInList.map(esc).join('<br>') + '</div><div class="muted">→ แก้ในชีทให้เป็นชื่อในตัวเลือก หรือแจ้งให้เพิ่มตัวเลือกใน data.js</div></div>';
  if (p.unused.length) h += '<div class="card"><b>ℹ️ คำใน glossary ที่ไม่มีในตัวเลือกและ drugTH ไม่ได้ใช้</b> <span class="muted">(ไม่แตะ — ลบเองได้ถ้าไม่ต้องการ)</span><div class="muted">' + p.unused.map(esc).join(' · ') + '</div></div>';
  if (p.missingCols.length) h += '<div class="card">⚠ glossary ไม่มีคอลัมน์ภาษา: ' + p.missingCols.map(esc).join(', ') + '</div>';
  if (it.length) h += '<div class="row"><button class="btn g" onclick="applyGS()">✅ ทำรายการที่เลือก</button></div>';
  L.innerHTML = h;
}
async function applyGS() {
  const ids = Array.from(document.querySelectorAll('.gs_item:checked')).map(c => c.value);
  if (!ids.length) return toast('ยังไม่ได้เลือกรายการ');
  if (!confirm('ทำ ' + ids.length + ' รายการที่เลือก?\n(สำรองแท็บ glossary ไว้ในไฟล์ลับก่อน)')) return;
  toast('กำลังบันทึก…');
  try {
    const n = await run('admin_glossarySyncApply', GS.canon, ids);
    alert('✅ เสร็จแล้ว\n\nเพิ่มคำ ' + n.add + ' · แก้คำแปล ' + n.update + ' · ลบแถว ' + n.delete + ' · แก้ค่าใน drugTH ' + n.fix +
      '\n\nหน้าเว็บจะใช้คำใหม่เมื่อรีเฟรช · ภาษาพม่า เขมร ฮินดี อาหรับ ควรให้ผู้ที่ใช้ภาษานั้นตรวจอีกครั้ง');
    syncGloss();
  } catch (e) { toast('❌ ' + e.message); }
}
async function glossFix() {
  toast('กำลังตรวจทุกแท็บภาษา…');
  let pv;
  try { pv = await run('admin_glossaryFixPreview'); } catch (e) { return toast('❌ ' + e.message); }
  const ft = (pv.formulaTabs || []);
  if (!pv.total) return alert(ft.length ? 'แท็บภาษาเป็นแบบสูตร (' + ft.length + ' แท็บ) — ระบบไม่เขียนทับสูตร\nให้กด "🔗 อัปเกรดสูตรแท็บภาษา" แทน แล้วสูตรจะดึงคำแปลจาก glossary เอง'
    : 'ไม่มีช่องที่ต้องแก้ — คำแปลในแท็บภาษาตรงกับ medical_glossary แล้วทั้งหมด');
  const lines = pv.tabs.map(t => '■ ' + t.tab + ': ' + t.count + ' ช่อง\n' + t.samples.map(x => '   • ' + x.drug + ' [' + x.key + '] "' + x.from + '" → "' + x.to + '"').join('\n'));
  const msg = 'จะเขียนคำแปลจาก medical_glossary ทับ ' + pv.total + ' ช่อง:\n\n' + lines.join('\n\n').slice(0, 3500) +
    '\n\n(ระบบสำรองไฟล์ทั้งหมดไว้ในโฟลเดอร์ Pharmax Backups ก่อนเขียน) ยืนยัน?';
  if (!confirm(msg)) return;
  toast('กำลังสำรองข้อมูลและแก้คำแปล… (อาจใช้เวลา 1–2 นาที)');
  try { const r = await run('admin_glossaryFixApply'); alert('✅ แก้แล้ว ' + r.changed + ' ช่อง\n' + r.tabs.join('\n')); TR.data = null; loadTr(); }
  catch (e) { toast('❌ ' + e.message); }
}

PW ? load() : loginView();
async function saveBranch(row) {
  const newBranch = document.getElementById('ub' + row).value.trim();
  const btn = window.event ? window.event.target : null;
  if (btn) { btn.innerText = '⏳...'; btn.disabled = true; }

  try {
    // ส่งข้อมูลไปหา Code.gs โดยตรง
    const r = await fetch(await gasUrl(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateBranch', row: row, branchCode: newBranch })
    });
    const res = await r.json();

    if (res && res.ok) {
      if (btn) { 
        btn.innerText = '✅ เรียบร้อย'; 
        setTimeout(() => { btn.innerText = '💾 เซฟสาขา'; btn.disabled = false; }, 2000); 
      }
      toast('✅ บันทึกสาขาเรียบร้อยแล้ว');
    } else {
      alert('เกิดข้อผิดพลาด: ' + (res?.msg || 'ไม่สามารถบันทึกได้'));
      if (btn) { btn.innerText = '💾 เซฟสาขา'; btn.disabled = false; }
    }
  } catch (err) {
    alert('ติดต่อระบบหลังบ้านไม่ได้: ' + err.message);
    if (btn) { btn.innerText = '💾 เซฟสาขา'; btn.disabled = false; }
  }
}
